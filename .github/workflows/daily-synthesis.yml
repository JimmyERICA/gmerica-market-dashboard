name: Daily synthesis

on:
  schedule:
    # 13:15 UTC = 9:15am ET during daylight saving (8:15am EST in winter), weekdays
    - cron: '15 13 * * 1-5'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Generate synthesis
        run: node scripts/generate-synthesis.mjs
        env:
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
          FRED_KEY: ${{ secrets.FRED_KEY }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/synthesis.json
          git diff --cached --quiet || git commit -m "chore: daily synthesis $(date -u +%F)"
          git push
